<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>오늘의 진짜 정보판 — USD/KRW 환율</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1f2430;
    --muted: #7a8194;
    --line: #e7e9ee;
    --accent: #2b5fd9;
    --ok: #1a9c5b;
    --ok-bg: #e8f7ef;
    --error: #c0392b;
    --error-bg: #fdecea;
    --up: #c0392b;
    --down: #1a6fd6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 40px 16px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", "Pretendard", "Malgun Gothic", sans-serif;
    display: flex;
    justify-content: center;
  }
  .card {
    width: 100%;
    max-width: 480px;
    background: var(--card);
    border-radius: 16px;
    box-shadow: 0 2px 16px rgba(20, 24, 40, 0.06);
    padding: 28px 28px 24px;
  }
  .title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
  }
  h1 {
    font-size: 1.15rem;
    margin: 0;
    font-weight: 700;
  }
  .status {
    display: inline-block;
    font-size: 0.78rem;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .status--ok { color: var(--ok); background: var(--ok-bg); }
  .status--error { color: var(--error); background: var(--error-bg); }
  .status--loading { color: var(--accent); background: #eaf0fd; }

  .value {
    font-size: 2.1rem;
    font-weight: 800;
    margin: 18px 0 2px;
    letter-spacing: -0.01em;
  }
  .diff {
    font-size: 0.92rem;
    color: var(--muted);
    margin-bottom: 18px;
  }
  .diff--up { color: var(--up); }
  .diff--down { color: var(--down); }

  #stale-note {
    display: none;
    font-size: 0.8rem;
    color: var(--error);
    background: var(--error-bg);
    border-radius: 8px;
    padding: 8px 10px;
    margin-bottom: 16px;
  }

  .meta {
    border-top: 1px solid var(--line);
    padding-top: 14px;
  }
  .row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 6px 0;
    font-size: 0.86rem;
  }
  .row .label { color: var(--muted); flex-shrink: 0; }
  .row .val { text-align: right; word-break: break-all; }
  .row .val a { color: var(--accent); text-decoration: none; }
  .row .val a:hover { text-decoration: underline; }

  #update-now {
    margin-top: 14px;
    width: 100%;
    padding: 10px;
    border: 1px solid var(--accent);
    border-radius: 8px;
    background: white;
    color: var(--accent);
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
  }
  #update-now:hover { background: #eaf0fd; }
  #update-now:disabled { opacity: 0.6; cursor: default; }

  #retry {
    display: none;
    margin-top: 14px;
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: white;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
  }
  #retry:hover { opacity: 0.9; }

  .test-panel {
    margin-top: 22px;
    padding-top: 16px;
    border-top: 1px dashed var(--line);
  }
  .test-panel p {
    font-size: 0.78rem;
    color: var(--muted);
    margin: 0 0 8px;
  }
  .test-links {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .test-links a {
    font-size: 0.76rem;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px 10px;
    text-decoration: none;
  }
  .test-links a:hover { border-color: var(--accent); color: var(--accent); }
  .test-links a.reset { font-weight: 600; }
</style>
</head>
<body>
  <div class="card">
    <div class="title-row">
      <h1>USD → KRW 환율</h1>
      <span id="status" class="status status--ok">● 정상</span>
    </div>

    <div class="value" id="value">불러오는 중...</div>
    <div class="diff" id="diff"></div>
    <div id="stale-note"></div>

    <div class="meta">
      <div class="row"><span class="label">출처</span><span class="val" id="source">-</span></div>
      <div class="row"><span class="label">출처 확정일 (observed)</span><span class="val" id="observed">-</span></div>
      <div class="row"><span class="label">내가 조회한 시각 (fetched)</span><span class="val" id="fetched">-</span></div>
      <div class="row"><span class="label">기준 시간대</span><span class="val">Asia/Seoul (KST)</span></div>
    </div>

    <button id="update-now">지금 업데이트</button>
    <button id="retry">다시 시도</button>

    <div class="test-panel">
      <p>실패 상태 테스트 (채점용 시뮬레이션)</p>
      <div class="test-links">
        <a href="?simulate=slow">느림</a>
        <a href="?simulate=unauthorized">401·403</a>
        <a href="?simulate=limit">호출 제한</a>
        <a href="?simulate=offline">오프라인</a>
        <a href="?simulate=format">형식 변경</a>
        <a href="?" class="reset">정상으로 보기</a>
      </div>
    </div>
  </div>

  <script src="data/log.js"></script>
  <script src="app.js"></script>
</body>
</html>
